<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peril Micro Credit® - Unified Enterprise Portal</title>
    <style>
        :root {
            --primary: #0f2027;
            --secondary: #203a43;
            --accent: #2c5364;
            --gold: #d4af37;
            --success: #2ecc71;
            --danger: #e74c3c;
            --light: #f8f9fa;
            --dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 0;
            color: var(--dark);
        }

        /* PREMIUM LOGO OBJECT */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-emblem {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: 3px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* PHASE 1: AUTHENTICATION SCREEN */
        #authSection {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .auth-card h2 {
            margin: 10px 0 5px 0;
            color: var(--primary);
            font-size: 26px;
        }
        .auth-meta {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            border-color: var(--secondary);
            outline: none;
            box-shadow: 0 0 5px rgba(32,58,67,0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
        }
        .forgot-trigger {
            display: block;
            margin-top: 15px;
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        /* PHASE 2: CORE SOFTWARE DASHBOARD */
        #dashboardSection {
            display: none;
            padding: 25px;
        }
        .dashboard-header {
            background: white;
            padding: 20px 30px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .header-meta h2 { margin: 0; color: var(--primary); font-size: 26px; }
        .header-meta p { margin: 4px 0 0 0; color: #666; font-size: 13px; }
        
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        .panel-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .panel-card h3 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 2px solid var(--light);
            padding-bottom: 12px;
            font-size: 18px;
        }
        
        /* DATA PRESENTATION TABLES */
        .table-wrap { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #eef2f3; }
        th { background-color: var(--primary); color: white; font-weight: 600; }
        .action-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        /* PRINT MANAGEMENT MECHANICS */
        .print-view-manifest { display: none; background: white; padding: 40px; }
        @media print {
            body * { display: none !important; }
            .print-view-manifest, .print-view-manifest * { display: block !important; }
            .print-view-manifest table { display: table !important; }
            .print-view-manifest th { background: #0f2027 !important; color: white !important; display: table-cell !important; }
            .print-view-manifest td { display: table-cell !important; border-bottom: 1px solid #333 !important; }
        }
    </style>
</head>
<body>

<!-- ================= PHASE 1: LOGIN ENVIRONMENT ================= -->
<div id="authSection">
    <div class="auth-card">
        <div style="display: flex; justify-content: center; margin-bottom: 10px;">
            <div class="logo-emblem">R®</div>
        </div>
        <h2>Peril Micro Credit®</h2>
        <div class="auth-meta">Rudrapur, U.S. Nagar | info@perilmicrocredit.com</div>
        
        <form onsubmit="executeAuthentication(event)">
            <div class="form-group">
                <label>Admin User ID</label>
                <input type="text" id="loginUser" placeholder="Enter administrative ID" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter secure password" required>
            </div>
            <button type="submit" class="btn-primary">Secure Portal Login</button>
        </form>
        <a href="#" class="forgot-trigger" onclick="triggerMobileOTP()">Forgot Password via Verified Mobile OTP?</a>
    </div>
</div>

<!-- ================= PHASE 2: INTERNAL ENTERPRISE CORE ================= -->
<div id="dashboardSection">
    <div class="dashboard-header">
        <div class="logo-container">
            <div class="logo-emblem">R®</div>
            <div class="header-meta">
                <h2>Peril Micro Credit®</h2>
                <p>Rudrapur, U.S. Nagar, Uttarakhand | Contact: 8077935959 | Official: info@perilmicrocredit.com</p>
            </div>
        </div>
        <button class="action-btn" style="background:#e74c3c; color:white; padding:10px 20px;" onclick="window.location.reload()">Logout Portal</button>
    </div>

    <div class="grid-layout">
        <!-- OPERATIONAL LOAN INTAKE PANEL -->
        <div class="panel-card">
            <h3>New Loan Entry Management</h3>
            <form id="loanIntakeForm" onsubmit="commitLoanRecord(event)">
                <div class="form-group">
                    <label>Branch Nomenclature</label>
                    <select id="branchPrefix" onchange="syncSequentialID()">
                        <option value="PMCR">PMCR (Rudrapur Branch)</option>
                        <option value="PMCK">PMCK (Kichha Branch)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Customer ID (Self-Change Allowed)</label>
                    <input type="text" id="generatedID" placeholder="e.g. PMCR0001" required style="font-weight:bold; color:var(--primary); background: #fffcf0; border: 1px solid var(--gold);">
                </div>
                <div class="form-group">
                    <label>Customer Full Name</label>
                    <input type="text" id="cName" placeholder="Enter legal name" required>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="text" id="cMobile" placeholder="Enter 10-digit number" required>
                </div>
                <div class="form-group">
                    <label>Direct Loan Amount (₹)</label>
                    <input type="number" id="cAmount" placeholder="Enter numerical principal" required>
                </div>
                <div class="form-group">
                    <label>Loan Months (Tenure: 0-36 Max)</label>
                    <input type="number" id="cTenure" min="0" max="36" placeholder="Enter target months" required>
                </div>
                <div class="form-group">
                    <label>Capital Disbursal Date</label>
                    <input type="date" id="cDisbursalDate" required>
                </div>
                <div class="form-group">
                    <label>First EMI Operational Date</label>
                    <input type="date" id="cEmiStartDate" required>
                </div>
